<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Abhishek Dubasi. I measure how late robots are. Cyber-physical systems test and validation.">
  <title>Abhishek Dubasi: I measure how late robots are</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee7ff"/>
      <stop offset="1" stop-color="#b79cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2a44" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .trace { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw 3.2s ease-out forwards; }
      .ch2 { animation-delay: .5s; }
      .scan { animation: sweep 6s linear 3.4s infinite; opacity: 0; }
      .pulse { animation: blink 2.4s ease-in-out infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes sweep { 0% { transform: translateX(0); opacity: .0; } 5% { opacity: .55; } 95% { opacity: .55; } 100% { transform: translateX(880px); opacity: 0; } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .trace { animation: none; stroke-dashoffset: 0; } .scan, .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1000" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="380" rx="18" fill="url(#grid)" opacity=".7"/>
  <rect x=".5" y=".5" width="999" height="379" rx="18" fill="none" stroke="#2a3558"/>

  <!-- title block -->
  <text x="48" y="84" class="sans" font-size="46" font-weight="700" fill="url(#title)">Abhishek Dubasi</text>
  <text x="48" y="124" class="sans" font-size="24" fill="#e6edf3">I measure how late robots are.</text>
  <text x="48" y="154" class="mono" font-size="14" fill="#8b98b8">cyber-physical systems  /  test &amp; validation  /  timing, accuracy, ground truth</text>

  <!-- scope header -->
  <g class="mono" font-size="12" fill="#6b7aa0">
    <text x="48" y="190">CH1  stimulus</text>
    <text x="48" y="262" fill="#6b7aa0">CH2  actuator</text>
  </g>
  <circle cx="946" cy="184" r="5" fill="#ff5d5d" class="pulse"/>
  <text x="900" y="188" class="mono" font-size="12" fill="#8b98b8" text-anchor="end">REC</text>

  <!-- channel 1: stimulus (cyan) -->
  <path class="trace" filter="url(#glow)" stroke="#5ee6ff"
        d="M40 245 H150 V205 H300 V245 H430 V205 H580 V245 H710 V205 H860 V245 H960"/>
  <!-- channel 2: actuator (amber), same pulses, delayed -->
  <path class="trace ch2" filter="url(#glow)" stroke="#ffb454"
        d="M40 317 H196 V277 H346 V317 H476 V277 H626 V317 H756 V277 H906 V317 H960"/>

  <!-- delay marker on first pulse -->
  <g class="mono" font-size="13">
    <line x1="150" y1="198" x2="150" y2="330" stroke="#5ee6ff" stroke-dasharray="3 5" opacity=".6"/>
    <line x1="196" y1="198" x2="196" y2="330" stroke="#ffb454" stroke-dasharray="3 5" opacity=".6"/>
    <path d="M152 262 H194" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M152 262 l6 -4 v8 z M194 262 l-6 -4 v8 z" fill="#ffffff"/>
    <text x="173" y="354" text-anchor="middle" fill="#ffffff">&#916;t = ?</text>
  </g>

  <!-- scanning cursor -->
  <g class="scan">
    <rect x="40" y="196" width="2" height="140" fill="#ffffff"/>
  </g>

  <text x="952" y="354" class="mono" font-size="12" fill="#6b7aa0" text-anchor="end">one cursor, many trials, honest error bars</text>
</svg>
