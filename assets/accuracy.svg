<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Mean detection error against ground truth in simulation: original 89.6 millimetres, ChromaPick 1.1 millimetres.">
  <title>Mean detection error against simulator ground truth: 89.6 mm vs 1.1 mm</title>
  <defs>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .bar1 { transform-origin: 250px 0; animation: grow1 1.6s cubic-bezier(.2,.8,.2,1) both; }
      .bar2 { animation: grow2 1.6s cubic-bezier(.2,.8,.2,1) .3s both; }
      @keyframes grow1 { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes grow2 { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .bar1, .bar2 { animation: none; } }
    </style>
  </defs>
  <rect width="1000" height="250" rx="18" fill="#0d1117"/>
  <rect x=".5" y=".5" width="999" height="249" rx="18" fill="none" stroke="#2a3558"/>

  <text x="40" y="52" class="sans" font-size="22" font-weight="700" fill="#e6edf3">Does the vision actually point at the right place?</text>
  <text x="40" y="78" class="mono" font-size="13" fill="#8b98b8">mean detection error vs simulator ground truth, 31 layouts, 93 detections (simulation)</text>

  <text x="40" y="132" class="mono" font-size="14" fill="#8b98b8">original pipeline</text>
  <!-- 89.6 mm -> 600 px (6.7 px per mm) -->
  <rect class="bar1" x="250" y="112" width="600" height="28" rx="6" fill="#ff7b72"/>
  <text x="862" y="132" class="mono" font-size="16" font-weight="700" fill="#ff7b72">89.6 mm</text>

  <text x="40" y="190" class="mono" font-size="14" fill="#8b98b8">ChromaPick (mine)</text>
  <!-- 1.1 mm -> 7.4 px, drawn at 10 px minimum so it stays visible -->
  <rect class="bar2" x="250" y="170" width="7.4" height="28" rx="3" fill="#3fb950"/>
  <text x="270" y="190" class="mono" font-size="16" font-weight="700" fill="#3fb950">1.1 mm</text>

  <text x="40" y="232" class="mono" font-size="12" fill="#6b7aa0">An enhancement of the open-source MechaMind Labs sorter. An evaluation in one simulated scene, not a benchmark.</text>
</svg>
